services:
  postgres:
    image: postgres:16-alpine
    container_name: iris-data-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris_dev_2026
      POSTGRES_DB: iris_data_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
